data:
  processed_dir: "data/processed"
  target_col: "fraud_flag"

features:
  feature_cols:
    - "transaction_amount"
    - "login_attempts"
    - "device_risk_score"
    - "transfer_frequency"
    - "anomaly_score"
    - "account_age_days"
    - "transaction_time_hour"
    - "failed_transactions_last_30d"
    - "avg_monthly_balance"
    - "daily_transaction_count"
    - "geo_distance_km"
    - "session_duration_minutes"
    - "transaction_velocity_score"
    - "payment_channel"
    - "authentication_type"
    - "card_present_flag"
    - "international_transaction_flag"
    - "suspicious_ip_flag"

training:
  optuna_trials: 50
  test_size: 0.2
  random_state: 42

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "fraud_detection"
  run_name: "lightgbm_training"
  model_name: "FraudDetectionModel"

models:
  local_path: "models"
  model_filename: "fraud_model.pkl"